 solid #497d97;border-left:0;border-radius:0 50% 50% 0}.stem{position:absolute;left:48%;top:13%;width:5%;height:58%;transform:rotate(-18deg);background:linear-gradient(90deg,#7d8c97,#edf4f8,#96a6b2);border:1px solid #64747e;border-radius:20px}.stem:after{content:"";position:absolute;left:-50%;bottom:-13%;width:200%;height:29%;border-radius:50%;background:linear-gradient(90deg,#8d9ea9,#edf4f8,#80919c);border:1px solid #64747e}.draw canvas,.draw svg{width:100%;height:100%;position:absolute;inset:0}.draw canvas{touch-action:none;cursor:crosshair}progress{width:100%;height:12px;accent-color:#3c8270}[hidden]{display:none!important}@media(max-width:500px){header{flex-wrap:wrap}.slot{min-width:80px}.row,.bank,.slots{gap:6px}}

.hero{display:grid;grid-template-columns:1fr minmax(150px,38%);align-items:center;gap:18px;background:#edf4df}.hero-art{display:block;width:100%;border-radius:18px;mix-blend-mode:multiply}.picture-body{display:grid;grid-template-columns:minmax(170px,31%) minmax(0,1fr);gap:clamp(14px,2.5vw,24px);align-items:start}.scene{margin:0;padding:6px;background:#f5ead3;border:2px solid #c9baa2;border-radius:17px;min-width:0}.scene img{display:block;width:100%;border-radius:11px}.comparison{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 13px}.reading{padding:9px 4px;border:2px solid #abc3ad;border-radius:12px;background:#edf6e9;text-align:center;font-weight:750}.reading span{display:block;font-size:clamp(18px,3.2vw,30px);color:#244e58}.therm{height:7px;background:#e6b68d;border-radius:8px;margin:7px auto 0;max-width:80%;width:var(--fill)}@media(max-width:640px){.picture-body{grid-template-columns:1fr}.scene{width:min(240px,100%);margin:0 auto}.hero{grid-template-columns:1fr 33%;gap:8px}}

body{background:radial-gradient(ellipse at 8% 0%,#fffaf0 0%,transparent 53%),#f5ecd8}
header{background:#244942}
.question-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#345750;font-weight:750}
.question-meta .tag{border-radius:99px;padding:4px 12px;background:#dfedcd}
.game-panel{border:1px solid #b7c7ad;box-shadow:0 6px 0 #d6dfcb;padding:clamp(12px,2.7vw,26px)}
#question:focus{outline:none}
.scene{background:#fff;overflow:hidden}
.scene img{object-fit:contain;max-height:200px}
.sortmark{display:inline-flex;align-items:center;gap:8px}
.object-icon{width:clamp(48px,8vw,83px);height:40px;object-fit:contain;border-radius:5px}
.route{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,3vw,25px)}
.route-stop{display:grid;justify-items:center;gap:5px;position:relative;min-width:0}
.route-stop+.route-stop:before{content:"→";color:#be683e;font-weight:900;position:absolute;right:calc(100% - 2px);top:44%}
.route-stop .slot{width:100%;min-width:0;padding-inline:4px}
.route-stop .sortmark{font-size:.85em}
.answer-actions{margin-top:14px}
.bank{padding:10px;background:#f4e7ce;border-radius:13px}
@media(max-width:640px){.scene img{max-height:165px}.picture-body{gap:10px}}

:root{--metal:linear-gradient(130deg,#7c929d 0%,#f1f7f8 29%,#abbac1 51%,#e3ebef 73%,#99aeb9 100%);--plastic:linear-gradient(145deg,#687578,#293638 62%,#4e6465)}
.pot-studio{overflow:hidden;min-height:218px;padding:55px 16px 23px;border-radius:18px;background:radial-gradient(ellipse at 50% 45%,#fff9e6,#ecd9b6)}
.pot-shape{position:relative;width:min(100%,490px);margin:auto;display:flex;align-items:flex-start;gap:3%;isolation:isolate}
.pot-part{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;border:3px dashed #596f65;background:#fffaf0;border-radius:19px;min-width:0;padding:6px;transition:background-color .2s,transform .2s}
.pot-part b{font-size:clamp(15px,2.6vw,25px);z-index:2}.pot-part span{font-size:clamp(11px,1.65vw,16px);z-index:2}
.pot-body{width:61%;height:clamp(115px,18vw,167px);border-radius:10% 10% 27% 27%;box-shadow:0 10px 14px #63492e33}
.pot-body:before{content:"";position:absolute;top:-29px;left:-2%;width:104%;height:44px;border:3px dashed #596f65;border-radius:50%;background:inherit;pointer-events:none}
.pot-handle{width:36%;height:68px;border-radius:17px 28px 28px 17px;margin-top:18px;transform:rotate(-12deg);transform-origin:left center}
.pot-handle:before{content:"";position:absolute;right:98%;width:14%;height:19px;border-radius:5px;background:#839398;z-index:-1;pointer-events:none}
.material:before{content:"";display:inline-block;vertical-align:middle;width:22px;height:20px;margin-right:7px;border-radius:5px;border:1px solid #344a48;background:var(--texture)}
.pot-part[data-material=metal]{background:var(--metal);border:3px solid #5b7380;color:#172e38}
.pot-part[data-material=plastic]{background:var(--plastic);border:3px solid #243638;color:#fff}
.pot-part.filled:before{border-style:solid}
.pot-part.good{outline:3px solid #41936a}.pot-part.bad{outline:3px solid #c0574b}
.hover-drop{outline:4px solid #d08732;outline-offset:3px}
@media(max-width:450px){.pot-studio{padding-inline:12px}.pot-handle{height:57px}}

.picture-tile{display:inline-flex;align-items:center;gap:8px;min-height:54px}.slot.filled:not(.pot-part){display:inline-flex;align-items:center;justify-content:center;gap:6px}.visual-icon{display:inline-block;position:relative;vertical-align:middle;flex:none;width:34px;height:28px;border-radius:6px;color:#273d3c}.emoji-icon{font-size:25px;line-height:1;text-align:center;width:auto;min-width:29px}.picture-tile[aria-pressed=true] .visual-icon{color:#243d3b}.visual-icon.metal{background:var(--metal);border:1px solid #677d87}.visual-icon.plastic{background:var(--plastic);border:1px solid #51766e}.visual-icon.foam{background:radial-gradient(#a7adba 1px,#faf9ef 1.8px) 0 0/5px 5px;border:1px solid #8f959d}.visual-icon.bag{background:#83b6dd;border:2px solid #345b7d;border-radius:7px}.visual-icon.bag:after{content:"";position:absolute;left:26%;width:48%;height:35%;bottom:97%;border:2px solid #345b7d;border-bottom:0;border-radius:7px 7px 0 0}.visual-icon.wood-spoon:before{content:"";position:absolute;inset:42% 3% auto 8%;height:5px;border-radius:4px;background:#9c6838;transform:rotate(-27deg)}.visual-icon.wood-spoon:after{content:"";position:absolute;left:1%;top:44%;width:44%;height:47%;background:#b5824c;border:1px solid #80572e;border-radius:50%;transform:rotate(-27deg)}
.rod-left,.rod-right{background:linear-gradient(#d1dbe2,#687d86,#d9e0e9) center/100% 6px no-repeat}.rod-left:after,.rod-right:after{content:"";width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #234461;position:absolute;top:8px}.rod-left:after{left:-1px;background:#cb4c36}.rod-right:after{right:-1px;background:#388bb7}.temp-up,.temp-down,.temp-still,.heat-fast,.heat-slow{background:#f4f7ea;text-align:center;font-size:23px;font-weight:900;line-height:28px}.temp-up:after{content:"↑";color:#b13728}.temp-down:after{content:"↓";color:#176689}.temp-still:after{content:"＝"}.heat-fast:after{content:"»";color:#b13728}.heat-slow:after{content:"›";color:#176689}.object-scene{display:flex;align-items:center;justify-content:center;gap:14px;min-height:132px;padding:18px 9px}.object-scene .visual-icon{transform:scale(1.18)}.object-scene .emoji-icon{font-size:38px}
@media(max-width:550px){.match{grid-template-columns:minmax(0,1fr) minmax(115px,1fr)}.match .sortmark{flex-wrap:wrap}.picture-tile{gap:5px}}

.classroom{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;max-width:1320px;margin:auto;padding:0 clamp(12px,2vw,24px);align-items:start}.classroom main{margin:0;width:100%;min-width:0;padding-inline:0}.claw-panel{background:#edf5e4;border:2px solid #587c69;border-radius:17px;padding:12px;text-align:center;margin-top:26px;position:sticky;top:12px}.claw-panel h2{font-size:20px;margin:0}.claw-panel p{margin:2px 0}.claw-panel button{font-size:15px;margin:3px;padding:6px 10px}.claw-panel #studentsLeft{font-size:14px}#studentNumber{font-size:32px;font-weight:900;color:#245440}#machine{position:relative;max-width:185px;margin:auto}
.workshop-picture{position:relative;width:min(100%,365px,56vh);margin:8px auto 0}.workshop-picture img{display:block;width:100%;border:1px solid #c6b495;border-radius:16px}.material-spot{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);min-width:28px;min-height:30px;transform:translate(-50%,-50%);padding:0;background:#fff6dbdb;border:3px dashed #214a40;border-radius:12px;font-size:clamp(18px,4vw,31px);line-height:1}.material-spot.flat{border-radius:50%}.material-spot[data-texture]:not([data-texture=""]){border-style:solid;opacity:1;cursor:default}.material-spot[data-texture=metal]{background:var(--metal)}.material-spot[data-texture=wood]{background:repeating-linear-gradient(7deg,#9d653d 0px,#dca46e 3px,#c18553 12px)}.material-spot[data-texture=foam]{background:radial-gradient(#abafba 1px,#faf7e9 1.8px) 0 0/5px 5px}.material-spot[data-texture=cloth],.visual-icon.cloth{background:repeating-linear-gradient(45deg,#cc8d5f 0px,#f0be9a 3px,#f0be9a 6px)}.material-spot[data-texture=air],.visual-icon.air{background:radial-gradient(circle at 30% 30%,white 2px,transparent 5px),radial-gradient(circle at 62% 74%,white 2px,transparent 4px),#a3d5e9}.work-bank{margin-bottom:12px}
@media(max-width:820px){.classroom{grid-template-columns:minmax(0,1fr) 146px;gap:8px}.claw-panel{padding:6px}.claw-panel h2{font-size:16px}.claw-panel button{font-size:13px}}@media(max-width:520px){.classroom{display:flex;flex-direction:column;align-items:stretch}.claw-panel{position:static;margin:0 0 12px;display:grid;grid-template-columns:1fr 1fr;place-items:center;gap:3px}.claw-panel h2{grid-column:1/-1}.claw-panel #machine,.claw-panel #studentNumber{grid-row:2}.claw-panel #machine{max-width:105px}.claw-panel #studentsLeft{grid-column:1/-1}}

.claw-cabinet{display:block;width:100%;height:auto}
.held-toy{opacity:0}.caught .held-toy{opacity:1}.caught #floorToy{opacity:0}
.jaw-left{transform-origin:84px 68px}.jaw-right{transform-origin:96px 68px}
.caught .jaw-left{transform:rotate(-17deg)}.caught .jaw-right{transform:rotate(17deg)}
.grabbing .claw-descend{animation:lowerClaw 1.55s ease-in-out both}
.grabbing .claw-cable{transform-origin:90px 49px;animation:extendCable 1.55s ease-in-out both}
.grabbing .jaw-left{animation:closeLeft 1.55s ease-in-out both}.grabbing .jaw-right{animation:closeRight 1.55s ease-in-out both}
.grabbing .held-toy{animation:takeToy 1.55s step-end both}.grabbing #floorToy{animation:removeToy 1.55s step-end both}
@keyframes lowerClaw{0%,100%{transform:translateY(0)}38%,59%{transform:translateY(48px)}}
@keyframes extendCable{0%,100%{transform:scaleY(1)}38%,59%{transform:scaleY(4.7)}}
@keyframes closeLeft{0%,39%{transform:rotate(0)}55%,100%{transform:rotate(-17deg)}}
@keyframes closeRight{0%,39%{transform:rotate(0)}55%,100%{transform:rotate(17deg)}}
@keyframes takeToy{0%{opacity:0}55%,100%{opacity:1}}
@keyframes removeToy{0%{opacity:1}55%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.grabbing *{animation:none!important}}
</style>

  ? `<span class="visual-icon ${symbol}" aria-hidden="true"></span>`
  : `<span class="visual-icon emoji-icon" aria-hidden="true">${symbol}</span>`;

const fullRound=tasks.map((_,i)=>i);
const app=document.querySelector('#app');

let index=0,round=[],mistakes=[];
function begin(selection){
 round=selection;index=0;mistakes=[];show();
}
function home(){
 app.innerHTML=`<div class="panel hero"><div><h1>熱力偵探</h1><p>小三常識《熱傳導》</p><button class="primary" id="start">開始挑戰 · ${tasks.length} 題</button></div>${picture('rabbit','拿着放大鏡的兔子偵探','hero-art')}</div>`;

}
get('home').onclick=home;
get('full').onclick=async()=>{
 try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{get('full').textContent='全螢幕未能開啟';}
};
document.addEventListener('fullscreenchange',()=>{get('full').textContent=document.fullscreenElement?'離開全螢幕':'全螢幕';});
function show(){
 const task=tasks[round[index]];
 const visual=task.kind==='workshop'?'':task.art?picture(task.art,task.alt):task.scene?`<div class="object-scene">${task.scene.map(icon).join('')}</div>`:'';
 app.innerHTML=`<div class="question-meta"><span class="tag">${task.topic}</span><span>第 ${index+1}／${round.length} 題</span></div><progress max="${round.length}" value="${index}" aria-label="答題進度"></progress>
 <section class="panel game-panel"><h2 id="question" tabindex="-1">${task.title}</h2><div class="${visual?'picture-body':''}">
 ${visual?`<figure class="scene">${visual}</figure>`:''}
 <div><div id="activity"></div><p id="feedback" class="status" role="status"></p></div>
 </div></section>
 <button class="primary" id="next" hidden>${index===round.length-1?'完成挑戰':'下一題'}</button>`;
 get('question').focus();
 if(task.kind==='workshop')renderWorkshop(task);else renderDrop(task);
 get('next').onclick=()=>{
  index++;
  if(index===round.length)finish();
  else show();
 };
}
function done(message){
 get('feedback').textContent=message;
 document.querySelector('progress').value=index+1;
 get('next').hidden=false;
}
function wrong(){
 if(!mistakes.includes(round[index]))mistakes.push(round[index]);
 get('feedback').textContent='再想一想，改一改答案。';
}

 </div>
 <div class="bank work-bank">${task.options.map((label,i)=>`<button class="tile picture-tile" data-material-choice="${i}" draggable="true" aria-pressed="false">${icon(task.icons[i])}<span>${label}</span></button>`).join('')}</div>
 <div id="conductor" hidden><p>你放上的物料是哪一類導熱體？</p><div class="row">
  <button id="conductorGood" aria-pressed="false">${icon('heat-fast')} 良好的導熱體</button>
  <button id="conductorPoor" aria-pressed="false">${icon('heat-slow')} 不良的導熱體</button>
 </div></div>
 <div class="row answer-actions"><button class="primary" id="verifyWork">檢查答案</button><button id="resetWork">重放</button></div>`;
 const tiles=[...target.querySelectorAll('[data-material-choice]')];
 const spot=get('materialSpot');
 const types=[get('conductorGood'),get('conductorPoor')];
 function refresh(){
  tiles.forEach((tile,i)=>tile.setAttribute('aria-pressed',String(selected===i)));
  types.forEach((button,i)=>button.setAttribute('aria-pressed',String(type===i)));
  spot.dataset.texture=placed<0?'':task.textures[placed];
  spot.setAttribute('aria-label',task.part+'：'+(placed<0?'放物料':task.options[placed]));
  spot.textContent=placed<0?'？':'';
  get('conductor').hidden=placed<0;
 }
 function apply(i){
  if(locked||!Number.isInteger(i)||i<0||i>=tiles.length)return;
  placed=i;selected=-1;type=-1;get('feedback').textContent='';refresh();
 }
 tiles.forEach((button,i)=>{
  button.onclick=()=>{if(!locked){selected=i;refresh();}};
  button.ondragstart=event=>{if(locked){event.preventDefault();return;}event.dataTransfer.setData('application/x-heat-material',String(i));};
 });
 spot.onclick=()=>{if(selected>=0)apply(selected);};
 spot.ondragover=event=>{if(!locked){event.preventDefault();spot.classList.add('hover-drop');}};
 spot.ondragleave=()=>spot.classList.remove('hover-drop');
 spot.ondrop=event=>{
  event.preventDefault();spot.classList.remove('hover-drop');
  const raw=event.dataTransfer.getData('application/x-heat-material');
  if(/^\d+$/.test(raw))apply(Number(raw));
 };
 types.forEach((button,i)=>{button.onclick=()=>{if(!locked){type=i;refresh();}};});
 get('resetWork').onclick=()=>{selected=-1;placed=-1;type=-1;get('feedback').textContent='';refresh();};
 get('verifyWork').onclick=()=>{
  if(placed<0){get('feedback').textContent='先把物料放到「？」。';return;}
  if(type<0){get('feedback').textContent='再選這種物料是哪一類導熱體。';return;}
  if(placed!==task.answer||type!==task.type){
   wrong();
   get('feedback').textContent=placed!==task.answer?'再想想這個部件要加快還是減慢傳熱。':'物料選對了，再想想它的傳熱速度。';
   return;
  }
  locked=true;[...tiles,...types,spot,get('resetWork'),get('verifyWork')].forEach(button=>{button.disabled=true;});
  done('✓ '+task.explain);
 };
}

function renderDrop(task){
 const slots=task.answers.map(()=>-1);
 let selected=-1,locked=false;
 const match=task.kind==='match';
 const pot=task.kind==='pot';
 get('activity').innerHTML=`<p>拖答案入框，或先按答案，再按空格。</p><div class="bank">
 ${task.options.map((text,i)=>`<button class="tile picture-tile" data-tile="${i}" draggable="true" aria-pressed="false">${icon(task.icons[i])}<span>${text}</span></button>`).join('')}</div>
 ${pot?`<div class="pot-studio"><div class="pot-shape">
 <button class="slot pot-part pot-body" data-slot="0" aria-label="鍋身：放物料"><b>？</b><span>鍋身</span></button>
 <button class="slot pot-part pot-handle" data-slot="1" aria-label="鍋柄外層：放物料"><b>？</b><span>鍋柄外層</span></button>
 </div></div>`:`<div class="${task.path?'route':match?'':'slots'}">${task.labels.map((label,i)=>`<div class="${task.path?'route-stop':match?'match':'row'}"><span class="sortmark">${task.labelIcons?icon(task.labelIcons[i]):''}${label}</span><button class="slot" data-slot="${i}" aria-label="${label}：放答案">放答案</button></div>`).join('')}</div>`}
 <div class="row answer-actions"><button class="primary" id="check">檢查答案</button><button id="reset">重放</button></div>`;
 const tiles=[...app.querySelectorAll('[data-tile]')],targets=[...app.querySelectorAll('[data-slot]')];
 function refresh(){
  tiles.forEach((button,i)=>button.setAttribute('aria-pressed',String(i===selected)));
  targets.forEach((button,i)=>{
   const filled=slots[i]>=0;
   const material=filled?task.options[slots[i]]:'放答案';
   if(pot){
    button.dataset.material=filled?(slots[i]===0?'metal':'plastic'):'';
    button.innerHTML=`<b>${filled?material:'？'}</b><span>${task.labels[i]}</span>`;
   }else button.innerHTML=filled?`${icon(task.icons[slots[i]])}<span>${material}</span>`:material;
   button.setAttribute('aria-label',task.labels[i]+'：'+material);
   button.classList.toggle('filled',filled);
   button.classList.remove('bad','good');
  });
 }
 function place(i,target){
  if(locked||i<0||i>=tiles.length)return;
  const old=task.reuse?-1:slots.indexOf(i);
  if(old!==-1)slots[old]=-1;
  slots[target]=i;
  selected=-1;refresh();
 }
 tiles.forEach((button,i)=>{
  button.onclick=()=>{selected=i;refresh();};
  button.ondragstart=e=>{if(locked){e.preventDefault();return;}e.dataTransfer.setData('text/plain',String(i));};
 });
 targets.forEach((button,i)=>{
  button.onclick=()=>{if(selected>=0)place(selected,i);else if(slots[i]>=0){slots[i]=-1;refresh();}};
  button.ondragover=e=>{if(!locked){e.preventDefault();button.classList.add('hover-drop');}};
  button.ondragleave=()=>button.classList.remove('hover-drop');
  button.ondrop=e=>{e.preventDefault();button.classList.remove('hover-drop');const value=e.dataTransfer.getData('text/plain');if(/^\d+$/.test(value))place(Number(value),i);};
 });
 get('reset').onclick=()=>{slots.fill(-1);selected=-1;refresh();get('feedback').textContent='';};
 get('check').onclick=()=>{
  if(slots.includes(-1)){get('feedback').textContent='請填好每一格。';return;}
  if(!task.answers.every((answer,i)=>answer===slots[i])){
   targets.forEach((button,i)=>button.classList.toggle('bad',task.answers[i]!==slots[i]));wrong();return;
  }
  locked=true;targets.forEach(button=>{button.classList.add('good');button.disabled=true;});
  tiles.forEach(button=>{button.disabled=true;});
  get('check').disabled=true;get('reset').disabled=true;done('✓ '+task.explain);
 };
}
function finish(){
 app.innerHTML=`<h1>🏆 完成溫習</h1><div class="panel"><p>${mistakes.length?`有 ${mistakes.length} 題可以再練習。`:'你已完成這輪挑戰！'}</p><div class="row">${mistakes.length?'<button class="primary" id="retry">重玩錯題</button>':''}<button id="restart">重玩全課</button></div></div>`;
 if(mistakes.length)get('retry').onclick=()=>begin([...mistakes]);
 get('restart').onclick=()=>begin(fullRound);
}
const students=Array.from({length:32},(_,i)=>i+1);
let remaining=[...students],clawBusy=false;
const drawButton=get('drawStudent'), studentNumber=get('studentNumber'), machine=get('machine');
function showRemaining(){
 get('studentsLeft').textContent=`尚餘 ${remaining.length} 位`;
 drawButton.disabled=clawBusy||remaining.length===0;
}
function drawStudent(){
 if(clawBusy||!remaining.length)return;
 clawBusy=true;showRemaining();
 studentNumber.textContent='…';
 machine.classList.remove('caught');
 machine.classList.add('grabbing');
 const delay=window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:1580;
 window.setTimeout(()=>{
  const index=Math.floor(Math.random()*remaining.length);
  studentNumber.textContent=remaining.splice(index,1)[0]+' 號';
  machine.classList.remove('grabbing');machine.classList.add('caught');clawBusy=false;showRemaining();
 },delay);
}
drawButton.onclick=drawStudent;
get('resetStudents').onclick=()=>{
 if(clawBusy)return;
 remaining=[...students];machine.classList.remove('caught');studentNumber.textContent='？';showRemaining();
};
showRemaining();

home();
</script>
</html>
